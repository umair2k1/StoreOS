name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore StoreOS.sln
      - name: Build
        run: dotnet build StoreOS.sln --no-restore -c Release
      - name: Unit tests (Domain)
        run: dotnet test backend/tests/StoreOS.Domain.Tests --no-build -c Release --logger "trx;LogFileName=domain-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-results
          path: "**/domain-tests.trx"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build backend for client generation
        run: dotnet build backend/src/StoreOS.Api/StoreOS.Api.csproj
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check API client drift
        run: |
          npm run --prefix frontend generate-client
          git diff --exit-code frontend/src/app/core/api/generated-client.ts
      - name: Build frontend
        run: npm run build --prefix frontend -- --configuration production
